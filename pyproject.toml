[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "everliving"
version = "0.1.0"
description = "A persistent world where your agent keeps living while you're offline"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "openai",  # used for the OpenAI-compatible providers (Groq, xAI)
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
everliving = "everliving.cli:main"
everliving-web = "everliving.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The page is read from disk at startup, so it has to ship with the package.
everliving = ["static/*.html"]

[tool.pytest.ini_options]
# Tests run straight from the source tree, so they work without installing first.
pythonpath = ["src"]
testpaths = ["tests"]
